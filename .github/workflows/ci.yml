name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Lint + build (React/TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build e typecheck
        run: npm run build
