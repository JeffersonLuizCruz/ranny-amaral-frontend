<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a73e8" />
    <title>Sem conexão · Photoizer CRM</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f9fb;
        color: #1f2328;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #e6e8ec;
        border-radius: 20px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 18px 40px -24px rgb(15 23 42 / 0.25);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: #1a73e8;
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        box-shadow: 0 8px 20px -8px rgb(26 115 232 / 0.6);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.6;
        color: #62666d;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #1a73e8;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 22px;
        cursor: pointer;
      }
      button:hover {
        background: #155fc4;
      }
      small {
        display: block;
        margin-top: 18px;
        font-size: 11px;
        color: #8a8f98;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1>Você está offline</h1>
      <p>
        Não foi possível carregar esta página. Seus clientes, pacotes, ensaios e contratos
        continuam salvos neste dispositivo e estarão disponíveis quando a conexão voltar.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
      <small>Photoizer CRM</small>
    </main>
  </body>
</html>
